<!--
  ============================================
  SUPABASE SETUP — run this once in the
  Supabase SQL Editor before using this app:
  ============================================

  create table todos (
    id bigint generated always as identity primary key,
    task text not null,
    completed boolean default false,
    created_at timestamp with time zone default now()
  );

  alter table todos enable row level security;

  create policy "Allow public access"
  on todos for all
  using (true)
  with check (true);

  -- If you already created the table before and are
  -- just adding the checklist feature, run only this:
  -- alter table todos add column completed boolean default false;
  ============================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eeeae1;
    --paper-edge: #e2ddd0;
    --rule: #b9c7d6;
    --margin: #c0433a;
    --ink: #2a2a27;
    --ink-soft: #6b6a63;
    --accent: #3f6b52;
    --accent-dark: #325843;
    --stamp: #b1352b;
    --hole: #d3ccbc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 16px;
    background: #d7d2c4;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.06), transparent 45%);
    font-family: 'IBM Plex Mono', monospace;
  }

  .pad {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--paper);
    border-radius: 4px 10px 10px 4px;
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 18px 40px rgba(30, 25, 15, 0.25),
      0 4px 10px rgba(30, 25, 15, 0.15);
    padding: 32px 28px 28px 56px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 37px,
      var(--rule) 38px
    );
    background-position: 0 92px;
  }

  /* spiral binder holes */
  .pad::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 22px;
    width: 10px;
    background-image: radial-gradient(circle, var(--hole) 4px, transparent 4.5px);
    background-size: 10px 34px;
    background-repeat: repeat-y;
    background-position: 0 26px;
  }

  /* red margin rule */
  .pad::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 44px;
    width: 1px;
    background: var(--margin);
    opacity: 0.55;
  }

  header {
    margin-bottom: 22px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  h1 {
    font-family: 'Special Elite', 'IBM Plex Mono', monospace;
    font-size: 26px;
    margin: 0;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  #todoInput {
    flex: 1;
    border: none;
    border-bottom: 1px dashed var(--ink-soft);
    background: transparent;
    padding: 4px 2px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }

  #todoInput::placeholder { color: #9a968a; }

  #todoInput:focus {
    border-bottom: 1px solid var(--accent);
  }

  #addBtn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--accent-dark);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  #addBtn:hover { background: var(--accent-dark); }
  #addBtn:active {
    transform: translateY(2px);
    box-shadow: none;
  }
  #addBtn:focus-visible,
  #todoInput:focus-visible,
  .checkbox:focus-visible,
  .removeBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    min-height: 38px;
  }

  .checkbox {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    margin-top: 2px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    background: #fff;
  }

  .checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .task-text {
    flex: 1;
    font-size: 14.5px;
    color: var(--ink);
    word-break: break-word;
    padding-top: 1px;
  }

  .task-text.done {
    color: #9a968a;
    text-decoration: line-through;
    text-decoration-color: #b6b1a3;
  }

  .stamp {
    position: absolute;
    right: 34px;
    top: 3px;
    font-family: 'Special Elite', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--stamp);
    border: 1.5px solid var(--stamp);
    border-radius: 3px;
    padding: 1px 6px;
    transform: rotate(-8deg);
    opacity: 0.85;
    pointer-events: none;
    text-transform: uppercase;
  }

  .removeBtn {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
  }

  .removeBtn:hover {
    color: var(--stamp);
  }

  .empty {
    padding: 8px 0 4px;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-style: italic;
  }

  footer {
    margin-top: 18px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  @media (max-width: 420px) {
    .pad { padding: 28px 18px 24px 46px; }
    .pad::before { left: 14px; }
    .pad::after { left: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #addBtn { transition: none; }
  }
</style>
</head>
<body>

<div class="pad">
  <header>
    <p class="eyebrow">Notepad — today</p>
    <h1>To-Do List</h1>
  </header>

  <div class="input-row">
    <input type="text" id="todoInput" placeholder="Write a task…" autocomplete="off" />
    <button id="addBtn" aria-label="Add task">+</button>
  </div>

  <ul id="todoList"></ul>

  <footer id="counter"></footer>
</div>

<!-- Supabase JS client (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ----- Supabase config -----
  const SUPABASE_URL = "https://gkkzfuknnglrvfryvtiz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Pnmu8ulmUjZ0EC6cI8NxaA_JtBiA6NT";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const TABLE_NAME = "todos"; // must match your Supabase table name

  const todoInput = document.getElementById("todoInput");
  const addBtn = document.getElementById("addBtn");
  const todoList = document.getElementById("todoList");
  const counter = document.getElementById("counter");

  // ----- Load todos from Supabase -----
  async function loadTodos() {
    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      console.error("Error loading todos:", error);
      todoList.innerHTML = `<li class="empty">Couldn't load the pad. Check the console.</li>`;
      counter.textContent = "";
      return;
    }

    renderTodos(data);
  }

  // ----- Render todos to the page -----
  function renderTodos(todos) {
    todoList.innerHTML = "";

    if (!todos || todos.length === 0) {
      todoList.innerHTML = `<li class="empty">Nothing on the pad yet — add your first task.</li>`;
      counter.textContent = "";
      return;
    }

    todos.forEach((todo) => {
      const li = document.createElement("li");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "checkbox";
      checkbox.checked = !!todo.completed;
      checkbox.setAttribute("aria-label", `Mark "${todo.task}" as done`);
      checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);

      const span = document.createElement("span");
      span.className = "task-text" + (todo.completed ? " done" : "");
      span.textContent = todo.task;

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "×";
      removeBtn.className = "removeBtn";
      removeBtn.setAttribute("aria-label", `Remove "${todo.task}"`);
      removeBtn.onclick = () => removeTodo(todo.id);

      li.appendChild(checkbox);
      li.appendChild(span);
      if (todo.completed) {
        const stamp = document.createElement("span");
        stamp.className = "stamp";
        stamp.textContent = "done";
        li.appendChild(stamp);
      }
      li.appendChild(removeBtn);
      todoList.appendChild(li);
    });

    const remaining = todos.filter((t) => !t.completed).length;
    counter.textContent = `${remaining} of ${todos.length} left`;
  }

  // ----- Add a new todo -----
  async function addTodo() {
    const task = todoInput.value.trim();
    if (!task) return;

    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .insert([{ task: task }]);

    if (error) {
      console.error("Error adding todo:", error);
      alert("Could not add task. Check console for details.");
      return;
    }

    todoInput.value = "";
    loadTodos();
  }

  // ----- Toggle completed status -----
  async function toggleTodo(id, completed) {
    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .update({ completed: completed })
      .eq("id", id);

    if (error) {
      console.error("Error updating todo:", error);
      alert("Could not update task. Check console for details.");
      return;
    }

    loadTodos();
  }

  // ----- Remove a todo -----
  async function removeTodo(id) {
    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .delete()
      .eq("id", id);

    if (error) {
      console.error("Error removing todo:", error);
      alert("Could not remove task. Check console for details.");
      return;
    }

    loadTodos();
  }

  // ----- Event listeners -----
  addBtn.addEventListener("click", addTodo);
  todoInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") addTodo();
  });

  // ----- Initial load -----
  loadTodos();
</script>

</body>
</html>
